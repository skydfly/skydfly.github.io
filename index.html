<!DOCTYPE html>
<html lang="en" ng-app="skydflyApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skydfly | Innovating the Future</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- AngularJS & ngRoute CDNs -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>

    <!-- Tailwind Custom Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af', // Blue-800
                        secondary: '#3b82f6', // Blue-500
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen font-sans text-gray-800">

    <!-- Navigation Bar -->
    <nav class="bg-primary text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="#!/" class="text-2xl font-extrabold tracking-widest text-white hover:text-gray-200">SKYDFLY</a>
                </div>
                <div class="hidden md:flex items-center space-x-2">
                    <a href="#!/" class="hover:bg-secondary px-4 py-2 rounded-md transition duration-300 font-medium">Home</a>
                    <a href="#!/about" class="hover:bg-secondary px-4 py-2 rounded-md transition duration-300 font-medium">About</a>
                    <a href="#!/services" class="hover:bg-secondary px-4 py-2 rounded-md transition duration-300 font-medium">Services</a>
                    <a href="#!/contact" class="hover:bg-secondary px-4 py-2 rounded-md transition duration-300 font-medium">Contact</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area (Injected by ng-view) -->
    <main class="flex-grow w-full" ng-view></main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-300 py-8 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <h3 class="text-xl font-bold text-white mb-2">Skydfly</h3>
            <p class="text-sm">Innovating the digital landscape.</p>
            <p class="text-sm mt-4">&copy; 2026 Skydfly. All rights reserved.</p>
        </div>
    </footer>

    <!-- ==========================================
         ANGULARJS TEMPLATES
         ========================================== -->

    <!-- Home Template -->
    <script type="text/ng-template" id="home.html">
        <div class="bg-white">
            <div class="max-w-7xl mx-auto px-4 py-20 text-center sm:py-32">
                <h1 class="text-5xl font-extrabold tracking-tight text-gray-900 sm:text-6xl mb-6">
                    Welcome to <span class="text-primary">Skydfly</span>
                </h1>
                <p class="mt-4 text-xl text-gray-500 max-w-2xl mx-auto">
                    We build modern, scalable, and beautifully designed digital experiences for the next generation of the web.
                </p>
                <div class="mt-10 flex justify-center gap-4">
                    <a href="#!/services" class="bg-primary text-white px-8 py-3 rounded-md text-lg font-semibold hover:bg-blue-700 transition shadow-md">Our Services</a>
                    <a href="#!/contact" class="bg-gray-100 text-primary px-8 py-3 rounded-md text-lg font-semibold hover:bg-gray-200 transition shadow-md">Get in Touch</a>
                </div>
            </div>
        </div>
    </script>

    <!-- About Template -->
    <script type="text/ng-template" id="about.html">
        <div class="max-w-4xl mx-auto px-4 py-16">
            <h2 class="text-4xl font-bold text-gray-900 mb-8 border-b-4 border-secondary inline-block pb-2">About Us</h2>
            <div class="prose lg:prose-lg text-gray-600">
                <p class="mb-6 text-lg leading-relaxed">
                    At Skydfly, we believe in the power of technology to transform businesses. Founded on the principles of innovation and excellence, our organization strives to deliver top-tier software solutions.
                </p>
                <p class="mb-6 text-lg leading-relaxed">
                    Our team is composed of passionate developers, designers, and strategists who are dedicated to pushing the boundaries of what's possible on the web.
                </p>
            </div>
        </div>
    </script>

    <!-- Services Template -->
    <script type="text/ng-template" id="services.html">
        <div class="bg-gray-50 py-16">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="text-center mb-16">
                    <h2 class="text-4xl font-bold text-gray-900">What We Do</h2>
                    <p class="mt-4 text-xl text-gray-600">Comprehensive solutions tailored to your needs.</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <!-- Service 1 -->
                    <div class="bg-white p-8 rounded-xl shadow-md hover:shadow-xl transition duration-300">
                        <div class="w-12 h-12 bg-blue-100 text-primary rounded-lg flex items-center justify-center mb-6 text-2xl">💻</div>
                        <h3 class="text-2xl font-bold text-gray-900 mb-3">Web Development</h3>
                        <p class="text-gray-600">Building fast, responsive, and secure single-page applications and enterprise websites.</p>
                    </div>
                    <!-- Service 2 -->
                    <div class="bg-white p-8 rounded-xl shadow-md hover:shadow-xl transition duration-300">
                        <div class="w-12 h-12 bg-blue-100 text-primary rounded-lg flex items-center justify-center mb-6 text-2xl">📱</div>
                        <h3 class="text-2xl font-bold text-gray-900 mb-3">UI/UX Design</h3>
                        <p class="text-gray-600">Crafting intuitive and beautiful user interfaces that provide seamless user experiences.</p>
                    </div>
                    <!-- Service 3 -->
                    <div class="bg-white p-8 rounded-xl shadow-md hover:shadow-xl transition duration-300">
                        <div class="w-12 h-12 bg-blue-100 text-primary rounded-lg flex items-center justify-center mb-6 text-2xl">🚀</div>
                        <h3 class="text-2xl font-bold text-gray-900 mb-3">Cloud Hosting</h3>
                        <p class="text-gray-600">Deploying and managing scalable applications using modern cloud infrastructure.</p>
                    </div>
                </div>
            </div>
        </div>
    </script>

    <!-- Contact Template -->
    <script type="text/ng-template" id="contact.html">
        <div class="max-w-3xl mx-auto px-4 py-16">
            <h2 class="text-4xl font-bold text-gray-900 mb-8 text-center">Contact Skydfly</h2>
            <div class="bg-white shadow-lg rounded-xl p-8">
                <form>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2" for="name">Full Name</label>
                        <input class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-primary focus:border-transparent transition" type="text" id="name" placeholder="John Doe">
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2" for="email">Email Address</label>
                        <input class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-primary focus:border-transparent transition" type="email" id="email" placeholder="john@example.com">
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2" for="message">Message</label>
                        <textarea class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-primary focus:border-transparent transition" id="message" rows="5" placeholder="How can we help you?"></textarea>
                    </div>
                    <button type="button" class="w-full bg-primary text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 transition duration-300 shadow-md">
                        Send Message
                    </button>
                </form>
            </div>
        </div>
    </script>

    <!-- ==========================================
         ANGULARJS APPLICATION LOGIC
         ========================================== -->
    <script>
        // Initialize the module and inject ngRoute
        var app = angular.module("skydflyApp", ["ngRoute"]);

        // Configure the routes
        app.config(function($routeProvider) {
            $routeProvider
            .when("/", {
                templateUrl : "home.html"
            })
            .when("/about", {
                templateUrl : "about.html"
            })
            .when("/services", {
                templateUrl : "services.html"
            })
            .when("/contact", {
                templateUrl : "contact.html"
            })
            // Redirect to home if URL doesn't match
            .otherwise({
                redirectTo: "/"
            });
        });
    </script>
</body>
</html>
